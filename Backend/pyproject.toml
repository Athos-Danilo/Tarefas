[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lume-api"
version = "0.1.0"
description = "Backend FastAPI do projeto Lume (Horizonte Vivo)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "psycopg[binary]>=3.2.0,<4.0",
  "alembic>=1.14.0,<2.0",
  "pymongo>=4.11.0,<5.0",
  "httpx>=0.28,<1.0",
  "google-auth[requests]>=2.35,<3.0",
  "pillow>=11.0,<13.0",
  "python-multipart>=0.0.18,<1.0",
  "pywebpush>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["principal"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["testes"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true
