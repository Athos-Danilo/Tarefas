name: CI Lume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend FastAPI (Ruff, Mypy e Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Backend/pyproject.toml

      - name: Instalar dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verificar lint (Ruff)
        run: ruff check src testes

      - name: Verificar formatacao (Ruff)
        run: ruff format --check src testes

      - name: Verificar tipos estritos (Mypy)
        run: mypy src

      - name: Executar testes automatizados (Pytest)
        run: pytest

  frontend:
    name: Frontend React (Prettier, ESLint, TypeScript, Vitest e Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formatacao (Prettier)
        run: npm run formatar:verificar

      - name: Verificar lint (ESLint)
        run: npm run lint

      - name: Verificar tipos estritos (TypeScript)
        run: npm run tipo

      - name: Executar testes automatizados (Vitest)
        run: npm test

      - name: Gerar build de producao (Vite)
        run: npm run build
