name: CI Lume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend FastAPI (Ruff, Mypy e Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: tarefas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tarefas_teste"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Backend/pyproject.toml

      - name: Instalar dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verificar lint (Ruff)
        run: ruff check src testes alembic

      - name: Verificar formatacao (Ruff)
        run: ruff format --check src testes alembic

      - name: Verificar tipos estritos (Mypy)
        run: mypy src

      - name: Executar testes automatizados (Pytest)
        env:
          LUME_POSTGRES_TESTE_URL: postgresql+psycopg://postgres:postgres_ci@127.0.0.1:5432/tarefas_teste
          LUME_MONGO_URL: mongodb://127.0.0.1:27017
          LUME_MONGO_BANCO_TESTE: tarefas_teste
        run: pytest

  frontend:
    name: Frontend React (Prettier, ESLint, TypeScript, Vitest e Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formatacao (Prettier)
        run: npm run formatar:verificar

      - name: Verificar lint (ESLint)
        run: npm run lint

      - name: Verificar tipos estritos (TypeScript)
        run: npm run tipo

      - name: Executar testes automatizados (Vitest)
        run: npm test

      - name: Gerar build de producao (Vite)
        run: npm run build
